name: Release

# Sur un tag vX.Y.Z : build Linux (AppImage) + Windows (portable .exe) et publie
# une GitHub Release avec les deux artefacts attachés.
# Déclenchement manuel (workflow_dispatch) possible pour tester le build sans
# créer de release (utile pour valider avant de tagger).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-script: build:linux
            artifact-name: linux-appimage
            artifact-glob: dist/*.AppImage
          - os: windows-latest
            build-script: build:win
            artifact-name: windows-portable
            artifact-glob: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pas de npm ci : package-lock.json n'est pas versionné dans ce repo
      - run: npm install

      - run: npm run ${{ matrix.build-script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
